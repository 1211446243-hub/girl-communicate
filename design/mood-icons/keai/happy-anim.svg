<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>开心</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: sway 2.16s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotate(-2.76deg); }
      50% { transform: rotate(2.76deg); }
    }
    .eyes { animation: squint 2.16s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes squint {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.92); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#6e3e55" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.7" fill="#f7dce6"/>
      <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#fff8fb" opacity="0.48"/>
      <circle cx="10.6" cy="10.1" r="1.15" fill="#fff8fb" opacity="0.80"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.62"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.62"/>
      </g>
      <circle cx="16" cy="16" r="12.7" fill="none" stroke="#7a4558" stroke-width="1.2"/>
      <g class="eyes">
        <path d="M8.6 15.35q2.35-2.55 4.7 0" stroke="#5a3344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.7 15.35q2.35-2.55 4.7 0" stroke="#5a3344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path class="smile" d="M12.4 19.55q3.6 3.35 7.2 0" stroke="#5a3344" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
