<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>兴奋</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: hop 2.02s ease-in-out infinite; }
    @keyframes hop {
      0%, 55%, 100% { transform: translateY(0); }
      28% { transform: translateY(-1.54px); }
    }
    .star { animation: twinkle 2.02s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
      40% { opacity: 1; transform: scale(1.2) rotate(18deg); }
      60% { opacity: 0.55; transform: scale(0.95) rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#3d5266" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.55" fill="#d4dee8"/>
      <ellipse cx="12.3" cy="11.1" rx="4.0" ry="2.5" fill="#eef3f7" opacity="0.30"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.10"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.10"/>
      </g>
      <circle cx="16" cy="16" r="12.55" fill="none" stroke="#3a4e60" stroke-width="1.1"/>
      <g class="eyes">
        <g class="eye"><ellipse cx="11.05" cy="14.2" rx="2.35" ry="2.55" fill="#2a3b4b"/>
          <circle cx="11.55" cy="13.55" r="0.52" fill="#eef3f7"/></g>
        <g class="eye"><ellipse cx="20.95" cy="14.2" rx="2.35" ry="2.55" fill="#2a3b4b"/>
          <circle cx="21.45" cy="13.55" r="0.52" fill="#eef3f7"/></g>
      </g>
      <ellipse cx="16" cy="21.2" rx="2.25" ry="1.95" fill="#2a3b4b"/>
      <g class="star"><path d="M25.15 7.2v2.55M23.85 8.45h2.6" stroke="#a7bccf" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
