<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>低落</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: sink 4.0s ease-in-out infinite; }
    @keyframes sink {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(0.69px) scale(0.985); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#3d5266" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.55" fill="#b0bbc6"/>
      <ellipse cx="12.3" cy="11.1" rx="4.0" ry="2.5" fill="#eef3f7" opacity="0.30"/>
      <circle cx="16" cy="16" r="12.55" fill="none" stroke="#3a4e60" stroke-width="1.1"/>
      <path d="M8.55 13.35h4.7" stroke="#2a3b4b" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.75 13.35h4.7" stroke="#2a3b4b" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="eyes">
        <path d="M8.7 16.15q2.35 1.35 4.7 0" stroke="#2a3b4b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18.6 16.15q2.35 1.35 4.7 0" stroke="#2a3b4b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path d="M14.35 22.15h3.3" stroke="#2a3b4b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
