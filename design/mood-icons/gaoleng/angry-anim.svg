<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>生气</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: shake 2.24s ease-in-out infinite; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-0.30px); }
      30% { transform: translateX(0.30px); }
      45% { transform: translateX(-0.21px); }
      60% { transform: translateX(0.21px); }
      75% { transform: translateX(0); }
    }
    .steam { animation: steam 2.24s ease-out infinite; }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      25% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-5.5px) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#3d5266" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.55" fill="#c4c8d0"/>
      <ellipse cx="12.3" cy="11.1" rx="4.0" ry="2.5" fill="#eef3f7" opacity="0.30"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.12"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.12"/>
      </g>
      <circle cx="16" cy="16" r="12.55" fill="none" stroke="#3a4e60" stroke-width="1.1"/>
      <path d="M8.15 11.35 13.4 13.45" stroke="#2a3b4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23.85 11.35 18.6 13.45" stroke="#2a3b4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="eyes">
        <path d="M8.7 15.55 13.5 16.15" stroke="#2a3b4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23.3 15.55 18.5 16.15" stroke="#2a3b4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path d="M13.7 21.35h4.6" stroke="#2a3b4b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="steam" style="transform-origin: 24px 8px">
        <path d="M22.6 10.2c1.4-1.8 0.2-3.1 1.5-4.8" stroke="#a7bccf" fill="none" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      </g>
  </g>
</svg>
