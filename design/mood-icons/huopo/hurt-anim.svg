<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>委屈</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .tear { animation: teardrop 2.58s ease-in infinite; }
    @keyframes teardrop {
      0% { opacity: 0; transform: translateY(-1.2px); }
      12% { opacity: 1; transform: translateY(0); }
      72% { opacity: 1; transform: translateY(3.90px); }
      88%, 100% { opacity: 0; transform: translateY(5.50px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#7a4a2a" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.7" fill="#f0cbb4"/>
      <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#fff6ec" opacity="0.50"/>
      <circle cx="10.6" cy="10.1" r="1.15" fill="#fff6ec" opacity="0.85"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#f09a7a" opacity="0.45"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#f09a7a" opacity="0.45"/>
      </g>
      <circle cx="16" cy="16" r="12.7" fill="none" stroke="#8a5530" stroke-width="1.2"/>
      <path d="M8.0 12.7q3.05-2.15 5.7 0.35" stroke="#5a3318" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24.0 12.7q-3.05-2.15-5.7 0.35" stroke="#5a3318" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="eyes">
        <ellipse cx="11.0" cy="15.15" rx="2.35" ry="2.2" fill="#5a3318"/>
        <ellipse cx="21.0" cy="15.15" rx="2.35" ry="2.2" fill="#5a3318"/>
        <circle cx="11.7" cy="14.4" r="0.85" fill="#fff6ec"/>
        <circle cx="21.7" cy="14.4" r="0.85" fill="#fff6ec"/>
      </g>
      <path class="tear" d="M7.05 17.45c0 1.85 2.05 1.85 2.05 0 0-1.25-1.02-2.55-1.02-2.55s-1.03 1.3-1.03 2.55z" fill="#f0f6fb" stroke="#5a3318" stroke-width="0.55"/>
      <path d="M12.7 21.3q1.6 1.85 3.3 0q1.7 1.85 3.3 0" stroke="#5a3318" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
