<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>平静</title>
  <style>

    .keai-calm-head, .keai-calm-eyes, .keai-calm-gaze {
      transform-box: view-box;
      transform-origin: 16px 16px;
    }
    @media (prefers-reduced-motion: reduce) {
      .keai-calm-head, .keai-calm-eyes, .keai-calm-gaze { animation: none !important; }
    }

    .keai-calm-head { animation: keai-calm-head 4s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    .keai-calm-eyes { animation: keai-calm-eyes 4s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    .keai-calm-gaze { animation: keai-calm-gaze 4s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    @keyframes keai-calm-head {
      0%, 8% { transform: translate(0px, 0px) rotate(0deg); }
      14%, 24% { transform: translate(1.25px, 0.15px) rotate(3.6deg); }
      31%, 38% { transform: translate(0px, 0px) rotate(0deg); }
      44%, 54% { transform: translate(-1.3px, 0.1px) rotate(-3.8deg); }
      61%, 66% { transform: translate(0px, 0px) rotate(0deg); }
      71%, 77% { transform: translate(-0.25px, -0.8px) rotate(-1.4deg); }
      82%, 86% { transform: translate(0px, 0px) rotate(0deg); }
      89%, 93% { transform: translate(0.8px, 0.6px) rotate(2.0deg); }
      97%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes keai-calm-eyes {
      0%, 8% { transform: translate(0px, 0px); }
      14%, 24% { transform: translate(0.75px, 0.1px); }
      31%, 38% { transform: translate(0px, 0px); }
      44%, 54% { transform: translate(-0.8px, 0.1px); }
      61%, 66% { transform: translate(0px, 0px); }
      71%, 77% { transform: translate(-0.15px, -0.6px); }
      82%, 86% { transform: translate(0px, 0px); }
      89%, 93% { transform: translate(0.5px, 0.45px); }
      97%, 100% { transform: translate(0px, 0px); }
    }
    @keyframes keai-calm-gaze {
      0%, 8% { transform: translate(0px, 0px); }
      14%, 24% { transform: translate(1.2px, 0.15px); }
      31%, 38% { transform: translate(0px, 0px); }
      44%, 54% { transform: translate(-1.25px, 0.15px); }
      61%, 66% { transform: translate(0px, 0px); }
      71%, 77% { transform: translate(-0.2px, -1.05px); }
      82%, 86% { transform: translate(0px, 0px); }
      89%, 93% { transform: translate(1.0px, 0.8px); }
      97%, 100% { transform: translate(0px, 0px); }
    }
  </style>
  <defs>
    <clipPath id="eyeL"><ellipse cx="11.0" cy="14.2" rx="2.25" ry="2.25"/></clipPath>
    <clipPath id="eyeR"><ellipse cx="21.0" cy="14.2" rx="2.25" ry="2.25"/></clipPath>
  </defs>
  <circle cx="16" cy="16.7" r="14.15" fill="#6e3e55" opacity="0.28"/>
  <g class="keai-calm-head">
    <circle cx="16" cy="16" r="12.7" fill="#f4d6e0"/>
    <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#fff8fb" opacity="0.48"/>
    <circle cx="10.6" cy="10.1" r="1.15" fill="#fff8fb" opacity="0.80"/>
    <g class="cheeks">
      <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.38"/>
      <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.38"/>
    </g>
    <circle cx="16" cy="16" r="12.7" fill="none" stroke="#7a4558" stroke-width="1.2"/>
    <g class="keai-calm-eyes">
      <ellipse cx="11.0" cy="14.2" rx="2.25" ry="2.25" fill="#5a3344"/>
      <ellipse cx="21.0" cy="14.2" rx="2.25" ry="2.25" fill="#5a3344"/>
      <g class="keai-calm-gaze">
        <circle clip-path="url(#eyeL)" cx="11.15" cy="13.55" r="0.85" fill="#fff8fb"/>
        <circle clip-path="url(#eyeR)" cx="21.15" cy="13.55" r="0.85" fill="#fff8fb"/>
      </g>
    </g>
    <path d="M13.5 20.0q2.5 1.85 5.0 0" stroke="#5a3344" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
