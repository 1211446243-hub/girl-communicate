<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>开心</title>
  <style>

    .keai-happy-head, .keai-happy-eyes, .keai-happy-gaze {
      transform-box: view-box;
      transform-origin: 16px 16px;
    }
    @media (prefers-reduced-motion: reduce) {
      .keai-happy-head, .keai-happy-eyes, .keai-happy-gaze { animation: none !important; }
    }

    .keai-happy-head { animation: keai-happy-head 4s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    .keai-happy-eyes { animation: keai-happy-eyes 4s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    @keyframes keai-happy-head {
      0%, 7% { transform: translate(0px, 0px) rotate(0deg); }
      13%, 23% { transform: translate(-1.3px, -0.1px) rotate(-3.8deg); }
      29%, 34% { transform: translate(0px, 0px) rotate(0deg); }
      39%, 52% { transform: translate(1.35px, 0.12px) rotate(4.0deg); }
      58%, 64% { transform: translate(0px, 0px) rotate(0deg); }
      69%, 75% { transform: translate(-0.3px, -0.85px) rotate(-1.2deg); }
      80%, 85% { transform: translate(0px, 0px) rotate(0deg); }
      89%, 93% { transform: translate(0.9px, 0.55px) rotate(2.2deg); }
      97%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes keai-happy-eyes {
      0%, 7% { transform: translate(0px, 0px); }
      13%, 23% { transform: translate(-1.8px, -0.15px); }
      29%, 34% { transform: translate(0px, 0px); }
      39%, 52% { transform: translate(1.85px, 0.15px); }
      58%, 64% { transform: translate(0px, 0px); }
      69%, 75% { transform: translate(-0.3px, -1.25px); }
      80%, 85% { transform: translate(0px, 0px); }
      89%, 93% { transform: translate(1.3px, 0.9px); }
      97%, 100% { transform: translate(0px, 0px); }
    }
  </style>
  <circle cx="16" cy="16.7" r="14.15" fill="#6e3e55" opacity="0.28"/>
  <g class="keai-happy-head">
    <circle cx="16" cy="16" r="12.7" fill="#f7dce6"/>
    <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#fff8fb" opacity="0.48"/>
    <circle cx="10.6" cy="10.1" r="1.15" fill="#fff8fb" opacity="0.80"/>
    <g class="cheeks">
      <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.62"/>
      <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#e889a4" opacity="0.62"/>
    </g>
    <circle cx="16" cy="16" r="12.7" fill="none" stroke="#7a4558" stroke-width="1.2"/>
    <g class="keai-happy-eyes">
      <path d="M8.6 15.35q2.35-2.55 4.7 0" stroke="#5a3344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.7 15.35q2.35-2.55 4.7 0" stroke="#5a3344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M12.4 19.55q3.6 3.35 7.2 0" stroke="#5a3344" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
