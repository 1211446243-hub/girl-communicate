<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>生闷气</title>
  <style>

    .gaoleng-sulky-head, .gaoleng-sulky-eyes, .gaoleng-sulky-gaze {
      transform-box: view-box;
      transform-origin: 16px 16px;
    }
    @media (prefers-reduced-motion: reduce) {
      .gaoleng-sulky-head, .gaoleng-sulky-eyes, .gaoleng-sulky-gaze { animation: none !important; }
    }

    .gaoleng-sulky-head { animation: gaoleng-sulky-head 6s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    .gaoleng-sulky-eyes, .gaoleng-sulky-gaze { animation: gaoleng-sulky-eyes 6s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
    @keyframes gaoleng-sulky-head {
      0%, 10% { transform: translate(0px, 0px) rotate(0deg); }
      16%, 28% { transform: translate(0.85px, 0.12px) rotate(2.5deg); }
      35%, 43% { transform: translate(0px, 0px) rotate(0deg); }
      49%, 62% { transform: translate(-0.95px, 0.08px) rotate(-2.7deg); }
      69%, 76% { transform: translate(0px, 0px) rotate(0deg); }
      81%, 86% { transform: translate(0.35px, 0.6px) rotate(1.2deg); }
      92%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes gaoleng-sulky-eyes {
      0%, 10% { transform: translate(0px, 0px); }
      16%, 28% { transform: translate(1.25px, 0.12px); }
      35%, 43% { transform: translate(0px, 0px); }
      49%, 62% { transform: translate(-1.3px, 0.1px); }
      69%, 76% { transform: translate(0px, 0px); }
      81%, 86% { transform: translate(0.5px, 0.85px); }
      92%, 100% { transform: translate(0px, 0px); }
    }
  </style>
