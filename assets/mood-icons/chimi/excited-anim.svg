<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>兴奋</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: hop 1.94s ease-in-out infinite; }
    @keyframes hop {
      0%, 55%, 100% { transform: translateY(0); }
      28% { transform: translateY(-2.18px); }
    }
    .star { animation: twinkle 1.94s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
      40% { opacity: 1; transform: scale(1.2) rotate(18deg); }
      60% { opacity: 0.55; transform: scale(0.95) rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#5e1a2c" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.7" fill="#e0c0c6"/>
      <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#f6e8ec" opacity="0.32"/>
      <circle cx="10.6" cy="10.1" r="1.15" fill="#f6e8ec" opacity="0.65"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#b06070" opacity="0.34"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#b06070" opacity="0.34"/>
      </g>
      <circle cx="16" cy="16" r="12.7" fill="none" stroke="#6a2838" stroke-width="1.2"/>
      <g class="eyes">
        <g class="eye"><ellipse cx="11.0" cy="13.95" rx="2.55" ry="2.55" fill="#4a1c28"/>
          <circle cx="11.85" cy="13.05" r="0.85" fill="#f6e8ec"/></g>
        <g class="eye"><ellipse cx="21.0" cy="13.95" rx="2.55" ry="2.55" fill="#4a1c28"/>
          <circle cx="21.85" cy="13.05" r="0.85" fill="#f6e8ec"/></g>
      </g>

      <g class="mouth"><ellipse cx="16" cy="21.35" rx="3.05" ry="2.55" fill="#4a1c28"/>
        <ellipse cx="16" cy="20.55" rx="1.55" ry="1.15" fill="#4a2a36" opacity="0.45"/></g>
      <g class="star"><path d="M25.55 6.7l0.55 1.35 1.4.55-1.4.55-.55 1.35-.55-1.35-1.4-.55 1.4-.55z" fill="#d07a8a"/></g>
  </g>
</svg>
