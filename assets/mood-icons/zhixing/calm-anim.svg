<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>平静</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .eye { animation: blink 3.58s ease-in-out infinite; }
    @keyframes blink {
      0%, 68%, 78%, 100% { transform: scaleY(1); }
      73% { transform: scaleY(0.08); }
    }
    .root { animation: breathe 3.58s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.0070); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#5e5139" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.55" fill="#e8dcc4"/>
      <ellipse cx="12.3" cy="11.1" rx="4.0" ry="2.5" fill="#f6f0e4" opacity="0.28"/>
      <circle cx="16" cy="16" r="12.55" fill="none" stroke="#5a4e38" stroke-width="1.1"/>
      <g class="eyes">
        <g class="eye"><path d="M8.7 14.7h4.8" stroke="#3d3424" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="eye"><path d="M18.5 14.7h4.8" stroke="#3d3424" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></g>
      </g>
      <path d="M14.3 20.35h3.4" stroke="#3d3424" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
