        <circle class="pupil" cx="13.15" cy="14.85" r="0.95" fill="#3d3424"/>
        <path d="M18.6 14.85h4.5" stroke="#3d3424" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
