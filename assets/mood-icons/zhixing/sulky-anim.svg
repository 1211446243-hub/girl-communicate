      <ellipse cx="12.2" cy="11.0" rx="3.8" ry="2.3" fill="#f6f0e4" opacity="0.28"/>
      <g class="cheeks">
        <ellipse cx="8.2" cy="20.2" rx="3.0" ry="2.1" fill="#d4b8a8" opacity="0.28"/>
        <ellipse cx="23.8" cy="20.2" rx="3.0" ry="2.1" fill="#d4b8a8" opacity="0.28"/>
      </g>
      <path d="M16 3.35 C22.7 3.35 27.7 8.15 27.95 14.35 C29.85 16.55 30.05 21.25 27.35 24.05 C24.85 28.85 19.35 29.65 16 29.65 C12.65 29.65 7.15 28.85 4.65 24.05 C1.95 21.25 2.15 16.55 4.05 14.35 C4.3 8.15 9.3 3.35 16 3.35 Z" fill="none" stroke="#5a4e38" stroke-width="1.1"/>
