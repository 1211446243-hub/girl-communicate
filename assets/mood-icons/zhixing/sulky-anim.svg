<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>生闷气</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .cheeks { animation: puff 2.91s ease-in-out infinite; }
    @keyframes puff {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.093); }
    }
    .pupil { animation: glance 2.91s ease-in-out infinite; }
    @keyframes glance {
      0%, 100% { transform: translateX(0); }
      30%, 60% { transform: translateX(0.67px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
