<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>吃醋</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .pupil { animation: peek 2.8s ease-in-out infinite; }
    @keyframes peek {
      0%, 100% { transform: translateX(0.63px); }
      50% { transform: translateX(-0.63px); }
    }
    .heart { animation: heartbit 2.8s ease-in-out infinite; }
    @keyframes heartbit {
      0%, 42%, 100% { opacity: 0.4; transform: scale(0.9); }
      55% { opacity: 1; transform: scale(1.22); }
      70% { opacity: 0.55; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#3d5266" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.55" fill="#c8d0d8"/>
      <ellipse cx="12.3" cy="11.1" rx="4.0" ry="2.5" fill="#eef3f7" opacity="0.30"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.40"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#c4b4bc" opacity="0.40"/>
      </g>
      <circle cx="16" cy="16" r="12.55" fill="none" stroke="#3a4e60" stroke-width="1.1"/>
      <path d="M8.2 11.15 13.35 13.15" stroke="#2a3b4b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.55 12.55h5.1" stroke="#2a3b4b" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="eyes">
        <path d="M8.6 14.85h4.7" stroke="#2a3b4b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="pupil" cx="13.1" cy="14.85" r="1.05" fill="#2a3b4b"/>
        <path d="M18.6 14.85h4.7" stroke="#2a3b4b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="pupil" cx="23.1" cy="14.85" r="1.05" fill="#2a3b4b"/>
      </g>
      <path d="M14.55 20.15c0.2 1.85 2.7 1.85 2.9 0" stroke="#2a3b4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
