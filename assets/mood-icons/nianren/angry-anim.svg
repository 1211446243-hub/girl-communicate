<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>生气</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .root { animation: shake 2.0s ease-in-out infinite; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-0.55px); }
      30% { transform: translateX(0.55px); }
      45% { transform: translateX(-0.39px); }
      60% { transform: translateX(0.39px); }
      75% { transform: translateX(0); }
    }
    .steam { animation: steam 2.0s ease-out infinite; }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      25% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-5.5px) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#56437a" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.7" fill="#ddd0e8"/>
      <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#f6f1fb" opacity="0.50"/>
      <circle cx="10.6" cy="10.1" r="1.15" fill="#f6f1fb" opacity="0.82"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#c9a0d8" opacity="0.48"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#c9a0d8" opacity="0.48"/>
      </g>
      <circle cx="16" cy="16" r="12.7" fill="none" stroke="#5a4678" stroke-width="1.2"/>
      <path d="M7.7 11.15 13.55 13.5" stroke="#3a2a55" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24.3 11.15 18.45 13.5" stroke="#3a2a55" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="eyes">
        <ellipse cx="11.05" cy="15.35" rx="2.3" ry="2.05" fill="#3a2a55"/>
        <ellipse cx="20.95" cy="15.35" rx="2.3" ry="2.05" fill="#3a2a55"/>
        <circle cx="11.55" cy="14.75" r="0.7" fill="#f6f1fb"/>
        <circle cx="21.45" cy="14.75" r="0.7" fill="#f6f1fb"/>
      </g>
      <path d="M13.1 21.7q2.9-1.7 5.8 0" stroke="#3a2a55" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="steam" style="transform-origin: 24px 8px">
        <path d="M22.6 10.2c1.4-1.8 0.2-3.1 1.5-4.8" stroke="#c9b0ea" fill="none" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      </g>
  </g>
</svg>
