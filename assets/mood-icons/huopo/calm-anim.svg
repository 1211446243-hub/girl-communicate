<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" overflow="visible">
  <title>平静</title>
  <style>
    .eye, .cheeks, .pupil, .star, .steam, .tear, .heart, .yawn, .mouth {
      transform-box: fill-box; transform-origin: center;
    }
    .root { transform-box: fill-box; transform-origin: 16px 22px; }

    .eye { animation: blink 2.75s ease-in-out infinite; }
    @keyframes blink {
      0%, 68%, 78%, 100% { transform: scaleY(1); }
      73% { transform: scaleY(0.08); }
    }
    .root { animation: breathe 2.75s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.0154); }
    }
    @media (prefers-reduced-motion: reduce) {
      .movable, .movable * { animation: none !important; }
    }
  </style>
  <g class="root movable">
      <circle cx="16" cy="16.7" r="14.15" fill="#7a4a2a" opacity="0.28"/>
      <circle class="face-shape" cx="16" cy="16" r="12.7" fill="#f5d3b8"/>
      <ellipse cx="12.0" cy="10.8" rx="5.0" ry="3.3" fill="#fff6ec" opacity="0.50"/>
      <circle cx="10.6" cy="10.1" r="1.15" fill="#fff6ec" opacity="0.85"/>
      <g class="cheeks">
        <ellipse cx="9.2" cy="19.4" rx="2.7" ry="1.85" fill="#f09a7a" opacity="0.32"/>
        <ellipse cx="22.8" cy="19.4" rx="2.7" ry="1.85" fill="#f09a7a" opacity="0.32"/>
      </g>
      <circle cx="16" cy="16" r="12.7" fill="none" stroke="#8a5530" stroke-width="1.2"/>
      <g class="eyes">
        <g class="eye"><ellipse cx="11.0" cy="14.2" rx="2.25" ry="2.25" fill="#5a3318"/>
          <circle cx="11.7" cy="13.5" r="0.85" fill="#fff6ec"/></g>
        <g class="eye"><ellipse cx="21.0" cy="14.2" rx="2.25" ry="2.25" fill="#5a3318"/>
          <circle cx="21.7" cy="13.5" r="0.85" fill="#fff6ec"/></g>
      </g>
      <path d="M13.5 20.0q2.5 1.85 5.0 0" stroke="#5a3318" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
